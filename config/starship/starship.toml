add_newline = false

format = "$python$directory$git_branch$git_status$character"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
style = "bold purple"

[python]
format = "[($virtualenv) ]($style)"
style = "bold yellow"

[cmd_duration]
min_time = 2000

[package]
disabled = true

[username]
disabled = true

[hostname]
disabled = true
