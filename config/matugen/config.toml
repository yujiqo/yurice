[config]

[config.custom_colors]
clock = { color = "#f5c26b", blend = true }
music = { color = "#f78fb3", blend = true }
wifi = { color = "#6bb8ff", blend = true }
ethernet = { color = "#a0a8a8", blend = true }
bluetooth = { color = "#4d8eff", blend = true }
volume = { color = "#c792ea", blend = true }
brightness = { color = "#ffcb6b", blend = true }
good = { color = "#7bd88f", blend = true }
charging = { color = "#f9e26b", blend = true }
warn = { color = "#ff9e64", blend = true }
bad = { color = "#ff6b6b", blend = true }
balanced = { color = "#7fd1c7", blend = true }

[templates.quickshell]
input_path = "templates/quickshell.json"
output_path = "~/.cache/yurice/colors.json"

[templates.kitty]
input_path = "templates/kitty.conf"
output_path = "~/.cache/yurice/kitty-colors.conf"
post_hook = "pkill -USR1 kitty || true"

[templates.niri]
input_path = "templates/niri.kdl"
output_path = "~/.cache/yurice/niri-colors.kdl"
post_hook = "niri msg action load-config-file || true"

[templates.nvim]
input_path = "templates/nvim.lua"
output_path = "~/.cache/yurice/nvim-colors.lua"
post_hook = "pkill -USR1 -x nvim || true"
